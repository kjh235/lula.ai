<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title>Lula.ai - Customers</title>
</head>
<body>
    <nav>
        <a href="/">Dashboard</a> | <a href="/customers">Customers</a>
    </nav>
    <h1>Retail Customers</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Orders</th>
                <th>Pieces</th>
                <th>LTV</th>
            </tr>
        </thead>
        <tbody>
            {% for c in customers %}
            <tr>
                <td><a href="/customers/{{ c.CustomerID }}">{{ c.CustomerName }}</a></td>
                <td>{{ c.CustomerEmail }}</td>
                <td>{{ c.OrderCount }}</td>
                <td>{{ c.TotalPieces | int }}</td>
                <td>${{ "%.2f" | format(c.LTV) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
