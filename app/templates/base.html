<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <title>AI-Lula - {% block title %}{% endblock %}</title>
</head>
<body class="app-layout">
    {% set active_page = active_page|default('') %}
    <aside class="sidebar">
        <div class="logo">AI-Lula</div>
        <nav>
            <a class="sidebar-link{% if active_page == 'dashboard' %} active{% endif %}" href="/dashboard">Dashboard</a>
            <a class="sidebar-link{% if active_page == 'customers' %} active{% endif %}" href="/customers">Customers</a>
            <a class="sidebar-link{% if active_page == 'inventory' %} active{% endif %}" href="/inventory">Inventory</a>
            <a class="sidebar-link{% if active_page == 'orders' %} active{% endif %}" href="/orders">Orders</a>
            <a class="sidebar-link{% if active_page == 'purchase_orders' %} active{% endif %}" href="/purchase-orders">Purchase Orders</a>
            <a class="sidebar-link{% if active_page == 'purchase_order' %} active{% endif %}" href="/purchase-order">Order Planning</a>
            <a class="sidebar-link{% if active_page == 'settings' %} active{% endif %}" href="/settings/credentials">Settings</a>
        </nav>
        <div class="sidebar-footer">
            {% if session.get('user_name') %}
            <span class="sidebar-user">{{ session['user_name'] }}</span>
            {% endif %}
            <button class="sidebar-link sync-btn" onclick="syncEmails(this)">Sync Emails</button>
            <a class="sidebar-link sign-out" href="/logout">Sign Out</a>
        </div>
    </aside>
    <div class="main">
        <div class="top-bar">
            <h1>{% block page_title %}{% endblock %}</h1>
        </div>
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
    function syncEmails(btn) {
        btn.disabled = true;
        btn.textContent = 'Starting...';
        fetch('/sync', {method: 'POST'})
            .then(r => r.json())
            .then(d => {
                btn.textContent = d.error ? 'Sync Failed' : 'Sync Queued';
                setTimeout(() => { btn.disabled = false; btn.textContent = 'Sync Emails'; }, 4000);
            })
            .catch(() => {
                btn.textContent = 'Sync Failed';
                setTimeout(() => { btn.disabled = false; btn.textContent = 'Sync Emails'; }, 3000);
            });
    }
    </script>
</body>
</html>
